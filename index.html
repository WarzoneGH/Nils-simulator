<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nils Mario Simulator</title>
    <style>
        body {
            margin: 0; padding: 0; background: #222;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; font-family: Arial, sans-serif; overflow: hidden;
        }
        canvas { background: #6b8cff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const GRAVITY = 0.6;
        let cameraX = 0;

        const platforms = [
            { x: 0, y: 520, w: 1200, h: 80 }, { x: 1400, y: 520, w: 1000, h: 80 },
            { x: 300, y: 400, w: 150, h: 30 }, { x: 550, y: 320, w: 200, h: 30 },
            { x: 850, y: 400, w: 150, h: 30 }, { x: 1550, y: 400, w: 250, h: 30 }
        ];

        const stefans = [
            { x: 400, y: 450, w: 30, h: 40, speed: 2, dir: 1, hp: 3, maxHp: 3 },
            { x: 600, y: 250, w: 30, h: 40, speed: 2, dir: 1, hp: 3, maxHp: 3 },
            { x: 1000, y: 450, w: 30, h: 40, speed: 2, dir: 1, hp: 3, maxHp: 3 },
            { x: 1600, y: 350, w: 30, h: 40, speed: 2, dir: 1, hp: 3, maxHp: 3 }
        ];

        const player = {
            x: 200, y: 300, w: 30, h: 50, vx: 0, vy: 0, speed: 5, jump: -13,
            grounded: false, right: true, stab: false, progress: 0, stabSpd: 0.2, length: 40
        };

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
        window.addEventListener("mousedown", e => {
            if (e.button === 0 && !player.stab) { player.stab = true; player.progress = 0; }
        });

        function update() {
            player.vx = 0;
            if (keys['a'] || keys['arrowleft']) { player.vx = -player.speed; player.right = false; }
            if (keys['d'] || keys['arrowright']) { player.vx = player.speed; player.right = true; }
            if ((keys['w'] || keys[' '] || keys['arrowup']) && player.grounded) { player.vy = player.jump; player.grounded = false; }

            player.vy += GRAVITY; player.x += player.vx;
            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vx > 0) player.x = p.x - player.w; else if (player.vx < 0) player.x = p.x + p.w;
                }
            }

            player.y += player.vy; player.grounded = false;
            for (let p of platforms) {
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; }
                    else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
                }
            }
            if (player.y > 600) { player.x = 200; player.y = 300; player.vy = 0; }

            let curLen = player.length;
            if (player.stab) {
                player.progress += player.stabSpd; curLen += Math.sin(player.progress * Math.PI) * 30;
                if (player.progress >= 1.0) player.stab = false;
            }

            let cy = player.y + player.h / 2;
            let tipX = player.right ? player.x + player.w + curLen : player.x - curLen;

            if (player.stab && player.progress <= player.stabSpd * 1.5) {
                for (let i = stefans.length - 1; i >= 0; i--) {
                    let e = stefans[i];
                    let hx = player.right ? player.x + player.w : tipX;
                    if (hx < e.x + e.w && hx + curLen > e.x && cy - 5 < e.y + e.h && cy + 5 > e.y) {
                        e.hp -= 1; player.stab = false;
                        if (e.hp <= 0) stefans.splice(i, 1);
                        break;
                    }
                }
            }

            for (let s of stefans) {
                s.x += s.speed * s.dir; if (s.x < 100 || s.x > 2000) s.dir *= -1;
                s.y += 4;
                for (let p of platforms) {
                    if (s.x < p.x + p.w && s.x + s.w > p.x && s.y < p.y + p.h && s.y + s.h > p.y) s.y = p.y - s.h;
                }
            }

            if (player.x - cameraX > 500) cameraX = player.x - 500;
            else if (player.x - cameraX < 200) cameraX = Math.max(0, player.x - 200);
        }

        function draw() {
            ctx.fillStyle = "#6b8cff"; ctx.fillRect(0, 0, 800, 600);
            for (let p of platforms) {
                ctx.fillStyle = "#00a800"; ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                ctx.strokeStyle = "#000"; ctx.strokeRect(p.x - cameraX, p.y, p.w, p.h);
            }
            for (let s of stefans) {
                let dx = s.x - cameraX; ctx.fillStyle = "#ff6464"; ctx.fillRect(dx, s.y + 15, s.w, s.h - 15);
                ctx.fillStyle = "#a84400"; ctx.beginPath(); ctx.arc(dx + s.w / 2, s.y + 10, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.fillRect(dx, s.y - 12, 30, 6);
                ctx.fillStyle = "#f00"; ctx.fillRect(dx, s.y - 12, (30 / s.maxHp) * s.hp, 6);
            }
            let dx = player.x - cameraX; ctx.fillStyle = "#0000b4"; ctx.fillRect(dx, player.y + 25, player.w, 25);
            ctx.fillStyle = "#e40000"; ctx.fillRect(dx, player.y + 10, player.w, 15);
            ctx.fillStyle = "#ffc896"; ctx.beginPath(); ctx.arc(dx + player.w / 2, player.y + 5, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#e40000"; ctx.fillRect(dx + 2, player.y - 8, player.w - 4, 6);

            // --- NY DESIGNAKUT FÖR PENNAN ---
            let cy = player.y + player.h / 2 + 5;
            let curLen = player.length + (player.stab ? Math.sin(player.progress * Math.PI) * 30 : 0);
            
            let bx = player.right ? dx + player.w : dx;
            let tx = player.right ? bx + curLen : bx - curLen;
            let dirSign = player.right ? 1 : -1;

            // Pennans tjocklek är nu smal (3 pixlar) så den ser ut som en linjal/penna
            ctx.lineWidth = 3; 

            // 1. Radergummi längst bak (röd)
            ctx.strokeStyle = "#ff4d4d";
            ctx.beginPath(); ctx.moveTo(bx, cy); ctx.lineTo(bx + (dirSign * 4), cy); ctx.stroke();

            // 2. Metallring (silver)
            ctx.strokeStyle = "#cccccc";
            ctx.beginPath(); ctx.moveTo(bx + (dirSign * 4), cy); ctx.lineTo(bx + (dirSign * 7), cy); ctx.stroke();

            // 3. Pennkroppen (gul kontorspenna)
            ctx.strokeStyle = "#ffd700";
            ctx.beginPath(); ctx.moveTo(bx + (dirSign * 7), cy); ctx.lineTo(tx - (dirSign * 6), cy); ctx.stroke();

            // 4. Trä-avsmalning och grafitudd längst fram (svart spets)
            ctx.strokeStyle = "#000000";
            ctx.beginPath(); ctx.moveTo(tx - (dirSign * 6), cy); ctx.lineTo(tx, cy); ctx.stroke();

            ctx.fillStyle = "#fff"; ctx.font = "22px Arial";
            ctx.fillText("Styr: A/D/Pilar | Hoppa: W/Space | Hugg: Vänsterklick", 20, 40);
            ctx.fillText("Stefans kvar: " + stefans.length, 20, 70);
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
